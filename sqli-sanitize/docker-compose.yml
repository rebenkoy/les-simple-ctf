name: sqli-sanitize
services:
  app:
    build: .
    container_name: sqli-sanitize
    environment:
      FLAG: "${FLAG:-}"
    restart: unless-stopped
    networks:
      - ctfnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sqli-sanitize.rule=Host(`sqli-sanitize.${DOMAIN:-ctf.test}`)"
      - "traefik.http.routers.sqli-sanitize.entrypoints=websecure"
      - "traefik.http.routers.sqli-sanitize.tls=true"
      - "traefik.http.services.sqli-sanitize.loadbalancer.server.port=80"
networks:
  ctfnet:
    external: true
    name: vuln-services-ctfnet
