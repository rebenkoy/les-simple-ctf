{% extends "base.html" %}
{% block title %}Secret Store — новая заметка{% endblock %}
{% block content %}
<div class="card">
  <div class="lock">➕</div>
  <h1>Новая заметка</h1>
  <p class="sub">Сохранится в ваши заметки (user_id {{ uid }}).</p>
  <form method="post" action="/add-note">
    <input type="text" name="name" placeholder="имя заметки" autocomplete="off">
    <input type="text" name="value" placeholder="текст заметки" autofocus autocomplete="off">
    <button type="submit" class="yes">Сохранить</button>
  </form>
  <div class="meta">
    <div class="qlabel">Запрос вставки</div>
    <pre class="sql">{{ pre }}&lt;name&gt;{{ mid }}<span class="inj">&lt;value&gt;</span>{{ suf }}</pre>
    <p class="hint"><a href="/notes">← к заметкам</a></p>
  </div>
  {% if error %}<pre class="out">{{ error }}</pre>{% endif %}
</div>
{% endblock %}
