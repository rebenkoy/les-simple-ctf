name: sqli-subquery
services:
  app:
    build: .
    container_name: sqli-subquery
    environment:
      FLAG: "${FLAG:-}"
    restart: unless-stopped
    networks:
      - ctfnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sqli-subquery.rule=Host(`sqli-subquery.${DOMAIN:-ctf.test}`)"
      - "traefik.http.routers.sqli-subquery.entrypoints=websecure"
      - "traefik.http.routers.sqli-subquery.tls=true"
      - "traefik.http.services.sqli-subquery.loadbalancer.server.port=80"
networks:
  ctfnet:
    external: true
    name: vuln-services-ctfnet
