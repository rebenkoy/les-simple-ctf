name: sqli-taut-num
services:
  app:
    build: .
    container_name: sqli-taut-num
    environment:
      FLAG: "${FLAG:-}"
    restart: unless-stopped
    networks:
      - ctfnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sqli-taut-num.rule=Host(`sqli-taut-num.${DOMAIN:-ctf.test}`)"
      - "traefik.http.routers.sqli-taut-num.entrypoints=websecure"
      - "traefik.http.routers.sqli-taut-num.tls=true"
      - "traefik.http.services.sqli-taut-num.loadbalancer.server.port=80"
networks:
  ctfnet:
    external: true
    name: vuln-services-ctfnet
