name: sqli-taut-str
services:
  app:
    build: .
    container_name: sqli-taut-str
    environment:
      FLAG: "${FLAG:-}"
    restart: unless-stopped
    networks:
      - ctfnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sqli-taut-str.rule=Host(`sqli-taut-str.${DOMAIN:-ctf.test}`)"
      - "traefik.http.routers.sqli-taut-str.entrypoints=websecure"
      - "traefik.http.routers.sqli-taut-str.tls=true"
      - "traefik.http.services.sqli-taut-str.loadbalancer.server.port=80"
networks:
  ctfnet:
    external: true
    name: vuln-services-ctfnet
