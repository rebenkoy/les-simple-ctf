name: xss-stored
services:
  app:
    build: .
    container_name: xss-stored
    restart: unless-stopped
    networks:
      - ctfnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.xss-stored.rule=Host(`xss-stored.${DOMAIN:-ctf.test}`)"
      - "traefik.http.routers.xss-stored.entrypoints=websecure"
      - "traefik.http.routers.xss-stored.tls=true"
      - "traefik.http.services.xss-stored.loadbalancer.server.port=80"
networks:
  ctfnet:
    external: true
    name: vuln-services-ctfnet
